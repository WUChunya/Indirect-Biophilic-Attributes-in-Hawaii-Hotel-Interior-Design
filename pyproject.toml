[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "biophilic"
dynamic = ["version"]
description = "Indirect biophilic design attributes and guest response in Hawaii hotels: review ABSA, photo-based BDIA coding, and statistical models."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Chunya Wu", email = "chunya@hawaii.edu" }]
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "scikit-learn>=1.3",
    "vaderSentiment>=3.3",
]

[project.optional-dependencies]
# LLM aspect-based sentiment and VLM photo coding (Claude API)
llm = ["anthropic>=2.0", "pydantic>=2.5"]
# Optional open-source ABSA via the PyABSA fork (heavy: installs torch)
absa = ["pyabsa @ git+https://github.com/WUChunya/PyABSA.git"]
dev = ["pytest>=8"]

[project.scripts]
biophilic = "biophilic.cli:main"

[tool.setuptools.dynamic]
version = { attr = "biophilic.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
